# Independent release for the rotpad tool. Triggered by an app-prefixed tag
# (e.g. rotpad-v0.1.0), independently of rotreader's version and tags.
# Builds the three-OS matrix, then publishes a GitHub Release with the installers.
name: Release rotpad

on:
  push:
    tags: ['rotpad-v*']

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      app: rotpad
      upload-artifacts: true

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: rotpad-*
          merge-multiple: true

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#rotpad-}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "rotpad-rottools-${{ steps.ver.outputs.version }}"
          files: dist/*
          generate_release_notes: true
