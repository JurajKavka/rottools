# Reusable build+package workflow. Given a tool name, builds it on all three
# OSes via vcpkg (with GitHub Actions binary caching) and produces installers.
# Called by ci.yml (no upload) and by each release-<tool>.yml (uploads artifacts).
#
# NOTE: first-run validation needed on GitHub — CI specifics (vcpkg wxwidgets
# webview feature, NSIS availability, exact apt package names) can only be
# confirmed once this runs on real runners.
name: build

on:
  workflow_call:
    inputs:
      app:
        description: "Tool to build (must match apps/<app> and the ROTTOOLS_BUILD_<APP> option)"
        required: true
        type: string
      upload-artifacts:
        description: "Upload the produced installers as workflow artifacts"
        default: false
        type: boolean

jobs:
  build:
    name: ${{ inputs.app }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            preset: ci-macos
          - os: ubuntu-22.04
            preset: ci-linux
          - os: windows-2022
            preset: ci-windows
    runs-on: ${{ matrix.os }}
    env:
      # vcpkg binary caching -> GitHub Actions cache (huge win: wxWidgets is slow to build)
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      - uses: actions/checkout@v4

      # Expose the ACTIONS_* tokens vcpkg's x-gha cache backend needs.
      - name: Enable vcpkg GHA binary cache
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # Linux: wxWebView needs WebKitGTK dev packages + GTK; plus ninja/pkg-config.
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsecret-1-dev libnotify-dev

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y

      # Use the vcpkg preinstalled on the runner image.
      - name: Configure
        shell: bash
        run: |
          APP_UPPER=$(echo "${{ inputs.app }}" | tr '[:lower:]' '[:upper:]')
          export VCPKG_ROOT="${VCPKG_INSTALLATION_ROOT}"
          cmake --preset ${{ matrix.preset }} "-DROTTOOLS_BUILD_${APP_UPPER}=ON"

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Package
        shell: bash
        run: cd build/${{ matrix.preset }} && cpack

      - name: Collect installers
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app }}-${{ matrix.os }}
          path: |
            build/${{ matrix.preset }}/*.dmg
            build/${{ matrix.preset }}/*.deb
            build/${{ matrix.preset }}/*.tar.gz
            build/${{ matrix.preset }}/*.exe
            build/${{ matrix.preset }}/*.zip
          if-no-files-found: warn
