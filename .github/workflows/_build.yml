# Reusable build+package workflow. Given a tool name, builds it on all three
# OSes and produces installers. macOS and Windows build a pinned, static
# wxWidgets from source; Linux uses the distribution's native wxGTK packages.
# Called by ci.yml (no upload) and by each release-<tool>.yml (uploads artifacts).
#
# NOTE: first-run validation needed on GitHub — CI specifics (the bundled
# wxWidgets WebView build, NSIS availability, exact apt package names) can only be
# confirmed once this runs on real runners.
name: build

on:
  workflow_call:
    inputs:
      app:
        description: "Tool to build (must match apps/<app> and the ROTTOOLS_BUILD_<APP> option)"
        required: true
        type: string
      upload-artifacts:
        description: "Upload the produced installers as workflow artifacts"
        default: false
        type: boolean

jobs:
  build:
    name: ${{ inputs.app }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Toolchain floor: the code uses std::format, so the runner needs
          # Xcode >= 15.3 (macos-15) and GCC >= 13 (ubuntu-24.04).
          - os: macos-15
            preset: ci-macos
          - os: ubuntu-24.04
            preset: ci-linux
          - os: windows-2022
            preset: ci-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # A release tag must describe the version that CPack will read for this
      # app. Prefixes keep tools independent even when their versions match.
      - name: Verify release tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION=$(tr -d '\r\n' < "apps/${{ inputs.app }}/VERSION")
          EXPECTED_TAG="${{ inputs.app }}-v${VERSION}"
          if [[ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match apps/${{ inputs.app }}/VERSION (${VERSION})." >&2
            echo "Expected tag: ${EXPECTED_TAG}" >&2
            exit 1
          fi

      # FetchContent keeps source trees and incremental dependency build outputs
      # here. Invalidate them whenever a pinned dependency or its build settings
      # change; application-only changes can safely reuse the cache.
      - name: Cache source dependencies
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/fetchcontent
          key: fetchcontent-${{ matrix.os }}-${{ hashFiles('CMakePresets.json', 'cmake/RotToolsWxWidgets.cmake', 'libs/backend/MarkdownToHtmlAsync/CMakeLists.txt') }}

      # Linux uses its native wxGTK/WebKitGTK stack; md4c falls back to
      # FetchContent. The packaged application records these system dependencies.
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config \
            libwxgtk3.2-dev libwxgtk-webview3.2-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsecret-1-dev libnotify-dev

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y

      # The Ninja generator needs cl.exe on PATH; this exports the VS dev
      # environment to all following steps.
      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: bash
        run: |
          APP_UPPER=$(echo "${{ inputs.app }}" | tr '[:lower:]' '[:upper:]')
          cmake --preset ${{ matrix.preset }} \
            -DROTTOOLS_BUILD_ROTREADER=OFF \
            -DROTTOOLS_BUILD_ROTPAD=OFF \
            "-DROTTOOLS_BUILD_${APP_UPPER}=ON"

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Package
        shell: bash
        run: cd build/${{ matrix.preset }} && cpack

      - name: Collect installers
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app }}-${{ matrix.os }}
          path: |
            build/${{ matrix.preset }}/*.dmg
            build/${{ matrix.preset }}/*.deb
            build/${{ matrix.preset }}/*.tar.gz
            build/${{ matrix.preset }}/*.exe
            build/${{ matrix.preset }}/*.zip
          if-no-files-found: warn
