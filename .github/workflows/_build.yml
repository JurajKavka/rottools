# Reusable build+package workflow. Given a tool name, builds it on all three
# OSes via vcpkg (binary-cached through actions/cache) and produces installers.
# Called by ci.yml (no upload) and by each release-<tool>.yml (uploads artifacts).
#
# NOTE: first-run validation needed on GitHub — CI specifics (vcpkg wxwidgets
# webview feature, NSIS availability, exact apt package names) can only be
# confirmed once this runs on real runners.
name: build

on:
  workflow_call:
    inputs:
      app:
        description: "Tool to build (must match apps/<app> and the ROTTOOLS_BUILD_<APP> option)"
        required: true
        type: string
      upload-artifacts:
        description: "Upload the produced installers as workflow artifacts"
        default: false
        type: boolean

jobs:
  build:
    name: ${{ inputs.app }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Toolchain floor: the code uses std::format, so the runner needs
          # Xcode >= 15.3 (macos-15) and GCC >= 13 (ubuntu-24.04).
          - os: macos-15
            preset: ci-macos
          - os: ubuntu-24.04
            preset: ci-linux
          - os: windows-2022
            preset: ci-windows
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_DISABLE_METRICS: "1"
      # vcpkg binary caching. The old 'x-gha' backend was removed upstream; with
      # it configured vcpkg warned and silently cached nothing, so every run
      # rebuilt wxWidgets from source (~10-30 min). The supported replacement is
      # the plain 'files' backend pointed at a directory we persist ourselves
      # with actions/cache below.
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-cache,readwrite"
    steps:
      - uses: actions/checkout@v4

      # A release tag must describe the version that CPack will read for this
      # app. Prefixes keep tools independent even when their versions match.
      - name: Verify release tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION=$(tr -d '\r\n' < "apps/${{ inputs.app }}/VERSION")
          EXPECTED_TAG="${{ inputs.app }}-v${VERSION}"
          if [[ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match apps/${{ inputs.app }}/VERSION (${VERSION})." >&2
            echo "Expected tag: ${EXPECTED_TAG}" >&2
            exit 1
          fi

      - name: Create vcpkg cache directory
        shell: bash
        run: mkdir -p "${{ github.workspace }}/vcpkg-cache"

      # Restore on the closest key, always save under a unique one: cache entries
      # are immutable, so reusing a key would never pick up newly built ports.
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-${{ matrix.os }}-${{ hashFiles('vcpkg.json', 'cmake/vcpkg-triplets/*.cmake') }}-${{ github.sha }}
          restore-keys: |
            vcpkg-${{ matrix.os }}-${{ hashFiles('vcpkg.json', 'cmake/vcpkg-triplets/*.cmake') }}-
            vcpkg-${{ matrix.os }}-

      # Linux does not use vcpkg (see the ci-linux preset): wxWidgets and its GTK
      # stack come from apt, and md4c falls back to FetchContent. That keeps the
      # job to one compile instead of ~100 source builds, and stops us depending
      # on gitlab.freedesktop.org, which throttles bulk archive downloads.
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config \
            libwxgtk3.2-dev libwxgtk-webview3.2-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsecret-1-dev libnotify-dev

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y

      # The Ninja generator needs cl.exe on PATH; this exports the VS dev
      # environment to all following steps.
      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Use the vcpkg preinstalled on the runner image.
      - name: Configure
        shell: bash
        run: |
          APP_UPPER=$(echo "${{ inputs.app }}" | tr '[:lower:]' '[:upper:]')
          export VCPKG_ROOT="${VCPKG_INSTALLATION_ROOT}"
          cmake --preset ${{ matrix.preset }} \
            -DROTTOOLS_BUILD_ROTREADER=OFF \
            -DROTTOOLS_BUILD_ROTPAD=OFF \
            "-DROTTOOLS_BUILD_${APP_UPPER}=ON"

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Package
        shell: bash
        run: cd build/${{ matrix.preset }} && cpack

      - name: Collect installers
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app }}-${{ matrix.os }}
          path: |
            build/${{ matrix.preset }}/*.dmg
            build/${{ matrix.preset }}/*.deb
            build/${{ matrix.preset }}/*.tar.gz
            build/${{ matrix.preset }}/*.exe
            build/${{ matrix.preset }}/*.zip
          if-no-files-found: warn
