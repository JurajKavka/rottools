# CI for pushes to main only (no per-PR/branch builds — too costly while
# iterating). Path filters build only the tools affected by a change (a tool is
# affected by its own apps/<tool>/** or by any shared libs/cmake).
# Installers are uploaded as workflow artifacts (Actions run > Artifacts) for
# testing; they expire per the repo's retention policy and are not a release.
name: CI

on:
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read 
    outputs:
      rotreader: ${{ steps.filter.outputs.rotreader }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'libs/**'
              - 'cmake/**'
              - 'CMakeLists.txt'
              - 'CMakePresets.json'
              - 'vcpkg.json'
              - '.github/workflows/_build.yml'
              - '.github/workflows/ci.yml'
            rotreader:
              - *shared
              - 'apps/rotreader/**'

  rotreader:
    needs: changes
    if: needs.changes.outputs.rotreader == 'true'
    uses: ./.github/workflows/_build.yml
    with:
      app: rotreader
      upload-artifacts: true
