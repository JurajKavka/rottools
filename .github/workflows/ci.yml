# TEMPORARY: pull_request is enabled while stabilizing the Linux CI build.
# Once the matrix is green, drop the pull_request trigger to go back to
# main-only builds (plus the manual workflow_dispatch button).
# Path filters build only the tools affected by a change (a tool is affected by
# its own apps/<tool>/** or by any shared libs/cmake).
# Installers are uploaded as workflow artifacts (Actions run > Artifacts) for
# testing; they expire per the repo's retention policy and are not a release.
name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read 
    outputs:
      rotreader: ${{ steps.filter.outputs.rotreader }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'libs/**'
              - 'cmake/**'
              - 'CMakeLists.txt'
              - 'CMakePresets.json'
              - 'vcpkg.json'
              - '.github/workflows/_build.yml'
              - '.github/workflows/ci.yml'
            rotreader:
              - *shared
              - 'apps/rotreader/**'

  rotreader:
    needs: changes
    # A manual run always builds; path filtering only gates automatic push runs.
    if: needs.changes.outputs.rotreader == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_build.yml
    with:
      app: rotreader
      upload-artifacts: true
