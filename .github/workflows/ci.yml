# Builds run when something lands on main, or on demand via the Actions tab
# ("Run workflow"). Branches and pull requests do not build: at this stage the
# three-OS matrix is not worth spending on every push.
# Path filters build only the tools affected by a change (a tool is affected by
# its own apps/<tool>/** or by any shared libs/cmake).
# Installers are uploaded as workflow artifacts (Actions run > Artifacts) for
# testing; they expire per the repo's retention policy and are not a release.
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      rotreader: ${{ steps.filter.outputs.rotreader }}
      rotpad: ${{ steps.filter.outputs.rotpad }}
      rotfm: ${{ steps.filter.outputs.rotfm }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'libs/**'
              - 'cmake/**'
              - 'apps/CMakeLists.txt'
              - 'CMakeLists.txt'
              - 'CMakePresets.json'
              - 'vcpkg.json'
              - '.github/workflows/_build.yml'
              - '.github/workflows/ci.yml'
            rotreader:
              - *shared
              - 'apps/rotreader/**'
            rotpad:
              - *shared
              - 'apps/rotpad/**'
            rotfm:
              - *shared
              - 'apps/rotfm/**'

  rotreader:
    needs: changes
    # A manual run always builds; path filtering only gates automatic push runs.
    if: needs.changes.outputs.rotreader == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_build.yml
    with:
      app: rotreader
      upload-artifacts: true

  rotpad:
    needs: changes
    # A manual run always builds; path filtering only gates automatic push runs.
    if: needs.changes.outputs.rotpad == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_build.yml
    with:
      app: rotpad
      upload-artifacts: true

  rotfm:
    needs: changes
    # A manual run always builds; path filtering only gates automatic push runs.
    if: needs.changes.outputs.rotfm == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_build.yml
    with:
      app: rotfm
      upload-artifacts: true
