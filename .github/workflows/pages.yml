# Builds the Astro site in www/ and publishes it to GitHub Pages at
# https://jurajkavka.github.io/rottools/
#
# Requires Settings > Pages > "Build and deployment" > Source = "GitHub Actions"
# (a one-time switch in the repo settings; without it the deploy step fails).
#
# Only site changes trigger it; the C++ tree is built by ci.yml.
name: pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - '.github/workflows/pages.yml'

# Pages needs to read the repo, mint an OIDC token and write the deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Do not cancel a running one — it could leave the site
# half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: www
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: www/package-lock.json

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: www/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
