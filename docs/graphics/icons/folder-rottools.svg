  <!-- 05 Instructions -->
  <g
     inkscape:groupmode="layer"
     inkscape:label="05 - Instructions"
     id="layerInstructions">
    <line
       x1="72"
       y1="980"
       x2="1128"
       y2="980"
       class="divider"
       id="line17" />
    <text
       x="130"
       y="1040"
       class="section"
       id="text18">How to edit</text>
    <text
       x="130"
       y="1090"
       class="label"
       id="text19">1. Open Object → Objects.</text>
    <text
       x="130"
       y="1124"
       class="label"
       id="text20">2. Expand “03 - Icon (EDIT HERE)” → “iconExport” → “iconGlyph”.</text>
    <text
       x="130"
       y="1158"
       class="label"
       id="text21">3. Select “folderPath”, then press N for the Node tool.</text>
    <text
       x="130"
       y="1192"
       class="label"
       id="text22">4. Edit the folder path on the large 24×24 grid.</text>
    <text
       x="130"
       y="1226"
       class="label"
       id="text23">5. All previews below update automatically because they reference iconGlyph.</text>
    <text
       x="130"
       y="1260"
       class="label"
       id="text24">6. Keep the path inside the dashed safe area unless optical balance requires otherwise.</text>
    <text
       x="130"
       y="1328"
       class="small"
       id="text25">Master geometry is in native 24×24 coordinates. The large board is only a magnified view.</text>
    <text
       x="130"
       y="1356"
       class="small"
       id="text26">Do not move iconGlyph into &lt;defs&gt;. It is intentionally a normal editable object.</text>
  </g>
