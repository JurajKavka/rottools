     inkscape:groupmode="layer"
     inkscape:label="03 - Icon (EDIT HERE)"
     id="layerIcon">
    <!--
      IMPORTANT:
      This nested SVG is the master editor. It uses native 24×24 coordinates,
      but is displayed at 336×336 on the page.
    -->
    <svg
       id="iconExport"
       x="432"
       y="220"
       width="336"
       height="336"
       viewBox="0 0 24 24"
       overflow="visible"
       version="1.1">
      <g
         id="iconGlyph"
         transform="rotate(-8.5652705,13.652737,13.017149)">
        <!-- EDIT THIS PATH in Inkscape with the Node tool -->
        <path
           id="folderPath"
           class="iconStroke"
           d="M 4.5018606,3.1104474 2.6097844,16.176893 c -0.2190828,1.512957 0.6508193,2.902752 1.9331153,3.088434 l 12.8229593,1.856818 c 1.282295,0.185684 2.510696,-0.90027 2.729779,-2.413227 L 21.390216,9.7687179 C 21.609299,8.2557614 20.739397,6.8659661 19.457101,6.6802844 L 11.879898,5.5830734 10.179928,2.5283999 7.0324738,2.0726354 C 5.7501777,1.8869534 4.5217772,2.9729058 4.3026946,4.4858626 Z"
           style="fill:url(#linearGradient48);fill-rule:nonzero;stroke:#ffffff;stroke-width:0.28571429;stroke-dasharray:none;stroke-opacity:0.55534708" />
      </g>
    </svg>
  </g>
