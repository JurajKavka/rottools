   xmlns:svg="http://www.w3.org/2000/svg"
   xmlns:sodipodi0="http://sodipodi.sourceforge.net/DTD/sodipodi-0.0.dtd">
  <sodipodi:namedview
     id="namedview1"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="0.4140625"
     inkscape:cx="704"
     inkscape:cy="910.49057"
     inkscape:window-width="1392"
     inkscape:window-height="969"
     inkscape:window-x="228"
     inkscape:window-y="36"
     inkscape:window-maximized="0"
     inkscape:current-layer="iconClipped" />
  <sodipodi0:namedview
     id="namedview"
     pagecolor="#e9e9ec"
     bordercolor="#666666"
     borderopacity="0.5"
     inkscape:pageopacity="0"
     inkscape:document-units="px"
     showgrid="false">
    <sodipodi0:guide
       position="100,1720"
       orientation="1,0"
       id="guideL" />
    <sodipodi0:guide
       position="924,1720"
       orientation="1,0"
       id="guideR" />
    <sodipodi0:guide
       position="100,1820"
       orientation="0,1"
       id="guideT" />
    <sodipodi0:guide
       position="100,796"
       orientation="0,1"
       id="guideB" />
  </sodipodi0:namedview>
  <defs
     id="defs">
    <!-- Shape definitions only. NOTE: anything in <defs> is never rendered by
         Inkscape, so the export target must NOT live here. -->
    <path
       id="squirclePath"
       d="M 512,100           C 305.7,100 224,105.5 163,166.5           C 105.5,224 100,305.7 100,512           C 100,718.3 105.5,800 163,858.5           C 224,918.5 305.7,924 512,924           C 718.3,924 800,918.5 858.5,858.5           C 918.5,800 924,718.3 924,512           C 924,305.7 918.5,224 858.5,163           C 800,105.5 718.3,100 512,100 Z" />
    <clipPath
       id="squircleClip"
       clipPathUnits="userSpaceOnUse">
      <use
         href="#squirclePath"
         id="clipUse" />
    </clipPath>
  </defs>
  <!-- ============ LAYER 1: GUIDES (hide or ignore; never exported) ============ -->
  <g
     inkscape:label="01 - Guides"
     inkscape:groupmode="layer"
     id="layerGuides"
     style="display:inline">
    <rect
       x="0"
       y="0"
       width="1024"
       height="1024"
       fill="#f4f4f6"
       id="canvasBg" />
    <rect
       x="0.5"
       y="0.5"
       width="1023"
       height="1023"
       fill="none"
       stroke="#b3b3b8"
       stroke-width="1"
       id="canvasBorder" />
    <rect
       x="100.5"
       y="100.5"
       width="823"
       height="823"
       fill="none"
       stroke="#c9c9ce"
       stroke-width="1"
       stroke-dasharray="6,6"
       id="safeZone" />
    <use
       href="#squirclePath"
       fill="none"
       stroke="#8a8ae0"
       stroke-width="2"
       stroke-dasharray="10,6"
       id="squircleGuide" />
    <text
       x="512"
       y="60"
       text-anchor="middle"
       font-family="Helvetica, Arial, sans-serif"
       font-size="30px"
       fill="#333333"
       id="titleText">macOS App Icon Template</text>
    <text
       x="512"
       y="980"
       text-anchor="middle"
       font-family="Helvetica, Arial, sans-serif"
       font-size="16px"
       fill="#8a8a90"
       id="subtitleText">Design inside Layer 02. Export target = object id &quot;iconExport&quot;.</text>
  </g>
  <!-- ============ LAYER 2: THE ICON — design here. This IS the export target. ============ -->
  <g
     inkscape:label="02 - Icon (design here)"
     inkscape:groupmode="layer"
     id="layerIcon"
     style="display:inline">
    <g
       id="iconExport">
      <!-- Transparent spacer: forces the export bounding box to the full 1024x1024
           canvas so the icon keeps Apple's 100px margin around the squircle.
           Do not delete or move this. -->
      <rect
         x="0"
         y="0"
         width="1024"
         height="1024"
         id="exportSpacer"
         style="fill:none;stroke:none" />
      <!-- Everything below is clipped to the squircle -->
      <g
         id="iconClipped"
         clip-path="url(#squircleClip)">
        <!-- White base so partially transparent colours composite predictably -->
        <use
           href="#squirclePath"
           fill="#ffffff"
           id="squircleBase" />
        <!-- Blue background -->
        <rect
           x="0"
           y="0"
           width="1024"
           height="1024"
           id="bgBlue"
           style="fill:#005000;fill-opacity:0.69999999" />
        <!-- Your glyph -->
        <path
           id="glyph"
           aria-label="#"
           style="font-weight:bold;font-size:192px;font-family:Helvetica, Arial, sans-serif;-inkscape-font-specification:'Helvetica, Arial, sans-serif Bold';text-anchor:middle;display:none;fill:#ffffff;stroke-width:4.38495"
           d="m 396.58661,447.61933 h -97.49205 l 21.50559,-59.40762 h 97.49206 L 470.18354,245.7041 h 95.10252 l -52.09132,142.50759 h 79.33176 l 50.65762,-142.5076 h 95.10255 l -50.65764,142.5076 h 96.05836 l -21.50559,59.40764 h -96.05834 l -38.71008,103.25614 h 97.49203 l -21.50559,59.40762 h -97.49207 l -51.13553,141.44678 h -95.10253 l 51.13555,-141.44678 h -78.37598 l -52.09132,141.44678 h -95.10253 l 52.09133,-141.44678 h -97.01413 l 21.50559,-59.40762 h 97.01412 z M 532.31083,550.87547 571.0209,447.61933 h -79.33175 l -37.27638,103.25614 z" />
        <text
           xml:space="preserve"
           style="display:inline;font-style:normal;font-variant:normal;font-weight:bold;font-stretch:normal;font-size:589.754px;font-family:Georgia;-inkscape-font-specification:'Georgia Bold';opacity:0.99823;fill:#ffffff;fill-opacity:1;stroke-width:368.596"
           x="274.95459"
           y="688.57318"
           id="text1"><tspan
             sodipodi:role="line"
             id="tspan1"
             x="274.95459"
             y="688.57318"
             style="stroke-width:368.596;fill:#ffffff;fill-opacity:1">R</tspan></text>
      </g>
    </g>
  </g>
  <!-- ============ LAYER 3: LIVE SIZE PREVIEWS (reference only, never exported) ============ -->
