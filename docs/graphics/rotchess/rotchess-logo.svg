      <g id="iconClipped" clip-path="url(#squircleClip)">
        <use href="#squirclePath" fill="#ffffff" id="squircleBase" />
        <rect x="0" y="0" width="1024" height="1024" id="background"
            style="fill:#315a49" />

        <g id="boardPattern" opacity="0.16" fill="#ffffff">
          <rect x="100" y="100" width="206" height="206" />
          <rect x="512" y="100" width="206" height="206" />
          <rect x="306" y="306" width="206" height="206" />
          <rect x="718" y="306" width="206" height="206" />
          <rect x="100" y="512" width="206" height="206" />
          <rect x="512" y="512" width="206" height="206" />
          <rect x="306" y="718" width="206" height="206" />
          <rect x="718" y="718" width="206" height="206" />
        </g>

        <g id="king" fill="#ffffff" stroke="#17352a" stroke-width="24" stroke-linejoin="round">
