          <path d="M 378,666 H 646 L 688,770 H 336 Z" />
          <path d="M 314,762 H 710 L 754,854 H 270 Z" />
        </g>
      </g>
    </g>
  </g>

  <g inkscape:label="03 - Preview" inkscape:groupmode="layer" id="layerPreviews">
    <svg x="0" y="1160" width="512" height="512" viewBox="0 0 1024 1024" id="prev512">
