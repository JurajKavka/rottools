     xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
     width="1408" height="1820" viewBox="0 0 1408 1820" version="1.1"
     id="macOS-icon-template" sodipodi:docname="rotchess-logo.svg" inkscape:version="1.3">
  <sodipodi:namedview id="namedview" pagecolor="#e9e9ec" bordercolor="#666666"
      borderopacity="0.5" inkscape:pageopacity="0" inkscape:document-units="px" showgrid="false" />
  <defs id="defs">
    <path id="squirclePath"
        d="M 512,100 C 305.7,100 224,105.5 163,166.5 C 105.5,224 100,305.7 100,512
           C 100,718.3 105.5,800 163,858.5 C 224,918.5 305.7,924 512,924
