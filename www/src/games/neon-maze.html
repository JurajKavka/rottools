<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#02040a">
  <title>Neon Maze</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #02040a;
      color: #f4feff;
      user-select: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .hud {
      position: fixed;
      inset: 0;
      padding: 20px 24px;
      pointer-events: none;
    }

    .hud-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      color: #65faff;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .32em;
    }

    .stats {
      display: flex;
      gap: 28px;
      color: #748da0;
      font-size: 9px;
      letter-spacing: .2em;
      text-align: right;
      text-transform: uppercase;
    }

    .stats strong {
      display: block;
      margin-top: 4px;
      color: #f7ffff;
      font-size: 19px;
      letter-spacing: .04em;
    }

    .lives {
      position: absolute;
      bottom: 20px;
      left: 24px;
      color: #7890a4;
      font-size: 9px;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .lives-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .life {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ffe85e;
      clip-path: polygon(0 0, 100% 50%, 0 100%);
    }

    .status {
      position: absolute;
      bottom: 20px;
      left: 50%;
      color: #ff8cde;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .14em;
      text-align: center;
      text-transform: uppercase;
      transform: translateX(-50%);
    }

    .hint {
      position: absolute;
      right: 24px;
      bottom: 20px;
      color: rgba(179, 209, 226, .55);
      font-size: 9px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      background: radial-gradient(circle at center, rgba(7, 27, 45, .5), rgba(1, 2, 8, .93));
      transition: opacity .2s ease;
    }

    .overlay.hidden {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .card {
      position: relative;
      isolation: isolate;
      width: min(560px, 93vw);
      padding: 44px;
      background: rgba(91, 241, 255, .5);
      text-align: center;
      clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px);
    }

    .card::before {
      position: absolute;
      z-index: -1;
      inset: 1px;
      background: linear-gradient(145deg, rgba(8, 25, 42, .99), rgba(7, 5, 20, .99));
      clip-path: polygon(19.5px 0, 100% 0, 100% calc(100% - 19.5px), calc(100% - 19.5px) 100%, 0 100%, 0 19.5px);
      content: "";
    }

    .eyebrow {
      color: #c3a3ff;
      font-size: 10px;
      letter-spacing: .42em;
      text-transform: uppercase;
    }

    h1 {
      margin: 12px 0 8px;
      color: #f7ffff;
      font-size: clamp(42px, 8vw, 70px);
      font-weight: 950;
      letter-spacing: -.07em;
      line-height: .9;
      text-shadow: 7px 5px 0 rgba(151, 57, 255, .28);
    }

    .subtitle {
      margin: 17px auto 26px;
      color: #9ab2c4;
      font-size: 12px;
      line-height: 1.7;
    }

    button {
      min-width: 200px;
      padding: 13px 24px;
      border: 1px solid #62f7ff;
      background: rgba(5, 35, 48, .9);
      color: #efffff;
      font: 800 12px/1 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      letter-spacing: .23em;
      text-transform: uppercase;
      cursor: pointer;
    }

    button:hover {
      background: rgba(12, 72, 85, .96);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 17px;
      margin-top: 25px;
      color: #70879a;
      font-size: 9px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .controls span {
      color: #e2fcff;
    }

    @media (max-width: 680px) {
      .stats {
        gap: 12px;
      }

      .stats strong {
        font-size: 15px;
      }

      .hint {
        display: none;
      }

      .card {
        padding: 34px 25px;
      }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div class="hud">
    <div class="hud-row">
      <div class="brand">NEON // MAZE</div>
      <div class="stats">
        <div>Score<strong id="score">000000</strong></div>
        <div>Stage<strong id="stage">01</strong></div>
        <div>Dots<strong id="dots">000</strong></div>
      </div>
    </div>
    <div class="lives">Reserve runners<div class="lives-row" id="lives"></div></div>
    <div class="status" id="status"></div>
    <div class="hint">WASD / arrows move · P pause</div>
  </div>

  <div class="overlay" id="overlay">
    <div class="card">
      <div class="eyebrow" id="eyebrow">Maze signal acquired</div>
      <h1 id="title">NEON<br>MAZE</h1>
      <p class="subtitle" id="subtitle">Consume every signal dot while four hunters predict your path.<br>Power cores reverse the chase—briefly.</p>
      <button id="start">Enter maze</button>
      <div class="controls">
        <div><span>WASD</span> move</div>
        <div><span>Arrows</span> move</div>
        <div><span>P</span> pause</div>
      </div>
    </div>
  </div>

  <script>
    (() => {
      "use strict";

      const WORLD_WIDTH = 960;
      const WORLD_HEIGHT = 720;
      const TILE = 32;
      const MAZE_X = 176;
      const MAZE_Y = 88;
      const TAU = Math.PI * 2;
      const MAP = [
        "###################",
        "#........#........#",
        "#.###.##.#.##.###.#",
        "#.................#",
        "#.##.#.#####.#.##.#",
        "#....#...#...#....#",
        "####.###.#.###.####",
        ".....#.......#.....",
        "###.#.##   ##.#.###",
        "....#.#     #.#....",
        "###.#.#######.#.###",
        "#........#........#",
        "#.##.###.#.###.##.#",
        "#..#...........#..#",
        "##.#.#.#####.#.#.##",
        "#........#........#",
        "###################",
      ];
      const ROWS = MAP.length;
      const COLUMNS = MAP[0].length;
      const DIRECTIONS = {
        left: { row: 0, column: -1, angle: Math.PI },
        right: { row: 0, column: 1, angle: 0 },
        up: { row: -1, column: 0, angle: -Math.PI / 2 },
        down: { row: 1, column: 0, angle: Math.PI / 2 },
      };
      const OPPOSITE = { left: "right", right: "left", up: "down", down: "up" };
      const POWER_CELLS = [[1, 1], [1, 17], [15, 1], [15, 17]];

      const canvas = document.getElementById("game");
      const context = canvas.getContext("2d");
      const overlay = document.getElementById("overlay");
      const startButton = document.getElementById("start");
      const eyebrowNode = document.getElementById("eyebrow");
      const titleNode = document.getElementById("title");
      const subtitleNode = document.getElementById("subtitle");
      const scoreNode = document.getElementById("score");
      const stageNode = document.getElementById("stage");
      const dotsNode = document.getElementById("dots");
      const livesNode = document.getElementById("lives");
      const statusNode = document.getElementById("status");

      const pellets = new Set();
      const powerPellets = new Set();
      const hunters = [];
      const particles = [];
      const stars = [];
      const player = {
        row: 15,
        column: 8,
        x: 0,
        y: 0,
        targetRow: null,
        targetColumn: null,
        direction: "left",
        desiredDirection: "left",
        speed: 128,
        invulnerable: 0,
      };

      let viewportWidth = innerWidth;
      let viewportHeight = innerHeight;
      let pixelRatio = 1;
      let viewScale = 1;
      let viewOffsetX = 0;
      let viewOffsetY = 0;
      let running = false;
      let paused = false;
      let score = 0;
      let stage = 1;
      let lives = 3;
      let powerTimer = 0;
      let hunterChain = 0;
      let stageTimer = 0;
      let statusTimer = 0;
      let statusText = "";
      let fruit = null;
      let fruitSpawned = false;
      let startingPelletCount = 0;
      let shake = 0;
      let lastTime = performance.now();
      let audioContext = null;
      let swipeStart = null;

      function resize() {
        viewportWidth = innerWidth;
        viewportHeight = innerHeight;
        pixelRatio = Math.min(devicePixelRatio || 1, 2);
        canvas.width = Math.floor(viewportWidth * pixelRatio);
        canvas.height = Math.floor(viewportHeight * pixelRatio);
        viewScale = Math.min(viewportWidth / WORLD_WIDTH, viewportHeight / WORLD_HEIGHT);
        viewOffsetX = (viewportWidth - WORLD_WIDTH * viewScale) / 2;
        viewOffsetY = (viewportHeight - WORLD_HEIGHT * viewScale) / 2;
        context.imageSmoothingEnabled = false;

        stars.length = 0;
        for (let index = 0; index < 90; index += 1) {
          stars.push({
            x: Math.random() * WORLD_WIDTH,
            y: Math.random() * WORLD_HEIGHT,
            size: Math.random() > 0.84 ? 2 : 1,
            phase: Math.random() * TAU,
          });
        }
      }

      function tone(frequency, duration, volume = 0.018, type = "square", endFrequency = frequency * 0.75) {
        if (!audioContext) {
          return;
        }
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        oscillator.type = type;
        oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);
        oscillator.frequency.exponentialRampToValueAtTime(Math.max(35, endFrequency), audioContext.currentTime + duration);
        gain.gain.setValueAtTime(volume, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + duration);
        oscillator.connect(gain).connect(audioContext.destination);
        oscillator.start();
        oscillator.stop(audioContext.currentTime + duration);
      }

      function burst(x, y, color, amount, speed = 120) {
        for (let index = 0; index < amount; index += 1) {
          const angle = Math.random() * TAU;
          const velocity = speed * (0.25 + Math.random() * 0.85);
          const life = 0.25 + Math.random() * 0.45;
          particles.push({
            x,
            y,
            vx: Math.cos(angle) * velocity,
            vy: Math.sin(angle) * velocity,
            life,
            maxLife: life,
            size: 1 + Math.random() * 2.5,
            color,
          });
        }
      }

      function keyFor(row, column) {
        return `${row}:${column}`;
      }

      function centerOf(row, column) {
        return {
          x: MAZE_X + column * TILE + TILE / 2,
          y: MAZE_Y + row * TILE + TILE / 2,
        };
      }

      function isWall(row, column) {
        if (row < 0 || row >= ROWS) {
          return true;
        }
        if (column < 0 || column >= COLUMNS) {
          return !(row === 7 || row === 9);
        }
        return MAP[row][column] === "#";
      }

      function nextCell(row, column, directionName) {
        const direction = DIRECTIONS[directionName];
        let nextRow = row + direction.row;
        let nextColumn = column + direction.column;
        if ((row === 7 || row === 9) && nextColumn < 0) {
          nextColumn = COLUMNS - 1;
        } else if ((row === 7 || row === 9) && nextColumn >= COLUMNS) {
          nextColumn = 0;
        }
        return { row: nextRow, column: nextColumn };
      }

      function canMove(row, column, directionName) {
        const next = nextCell(row, column, directionName);
        return !isWall(next.row, next.column);
      }

      function resetActors(invulnerability = 2) {
        const playerCenter = centerOf(15, 8);
        Object.assign(player, {
          row: 15,
          column: 8,
          x: playerCenter.x,
          y: playerCenter.y,
          targetRow: null,
          targetColumn: null,
          direction: "left",
          desiredDirection: "left",
          invulnerable: invulnerability,
        });

        const hunterData = [
          { row: 8, column: 8, color: "#ff547f", personality: "chaser", release: 0 },
          { row: 8, column: 9, color: "#ff70d7", personality: "ambusher", release: 1.2 },
          { row: 8, column: 10, color: "#55eaff", personality: "vector", release: 2.4 },
          { row: 9, column: 9, color: "#ffad4e", personality: "shy", release: 3.6 },
        ];
        hunters.length = 0;
        for (const data of hunterData) {
          const center = centerOf(data.row, data.column);
          hunters.push({
            ...data,
            spawnRow: data.row,
            spawnColumn: data.column,
            x: center.x,
            y: center.y,
            targetRow: null,
            targetColumn: null,
            direction: "left",
            eaten: false,
          });
        }
      }

      function createStage() {
        pellets.clear();
        powerPellets.clear();
        particles.length = 0;
        fruit = null;
        fruitSpawned = false;
        powerTimer = 0;
        hunterChain = 0;
        stageTimer = 0;

        const powerKeys = new Set(POWER_CELLS.map(([row, column]) => keyFor(row, column)));
        for (let row = 0; row < ROWS; row += 1) {
          for (let column = 0; column < COLUMNS; column += 1) {
            if (MAP[row][column] === ".") {
              const key = keyFor(row, column);
              if (powerKeys.has(key)) {
                powerPellets.add(key);
              } else {
                pellets.add(key);
              }
            }
          }
        }
        pellets.delete(keyFor(15, 8));
        startingPelletCount = pellets.size + powerPellets.size;
        resetActors();
        showStatus(`Stage ${String(stage).padStart(2, "0")} — maze charged`, 1.8);
        updateHud();
      }

      function resetGame() {
        score = 0;
        stage = 1;
        lives = 3;
        statusTimer = 0;
        shake = 0;
        running = true;
        paused = false;
        createStage();
      }

      function startGame() {
        if (!audioContext) {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
        audioContext.resume();
        overlay.classList.add("hidden");
        resetGame();
      }

      function endGame() {
        running = false;
        paused = false;
        eyebrowNode.textContent = "Maze signal lost";
        titleNode.innerHTML = "RUNNER<br>OFFLINE";
        subtitleNode.innerHTML = `Final score: <strong>${score.toLocaleString()}</strong><br>Stage reached: ${String(stage).padStart(2, "0")}`;
        startButton.textContent = "Run again";
        overlay.classList.remove("hidden");
        tone(120, 0.7, 0.055, "sawtooth", 38);
      }

      function updateHud() {
        scoreNode.textContent = String(score).padStart(6, "0");
        stageNode.textContent = String(stage).padStart(2, "0");
        dotsNode.textContent = String(pellets.size + powerPellets.size).padStart(3, "0");
        livesNode.replaceChildren();
        for (let index = 0; index < lives; index += 1) {
          const life = document.createElement("span");
          life.className = "life";
          livesNode.appendChild(life);
        }
      }

      function showStatus(text, duration = 1.5) {
        statusText = text;
        statusTimer = duration;
      }

      function updateStatus() {
        statusNode.textContent = statusTimer > 0
          ? statusText
          : powerTimer > 0
            ? `power chase ${powerTimer.toFixed(1)}s · chain ×${Math.max(1, 2 ** hunterChain)}`
            : "";
      }

      function beginMove(actor, directionName) {
        if (!canMove(actor.row, actor.column, directionName)) {
          return false;
        }
        if ((actor.row === 7 || actor.row === 9) && actor.column === 0 && directionName === "left") {
          actor.column = COLUMNS - 1;
          actor.x = centerOf(actor.row, actor.column).x;
        } else if ((actor.row === 7 || actor.row === 9) && actor.column === COLUMNS - 1 && directionName === "right") {
          actor.column = 0;
          actor.x = centerOf(actor.row, actor.column).x;
        }
        const target = nextCell(actor.row, actor.column, directionName);
        actor.direction = directionName;
        actor.targetRow = target.row;
        actor.targetColumn = target.column;
        return true;
      }

      function moveActor(actor, speed, delta, chooseDirection) {
        if (actor.targetRow === null) {
          chooseDirection(actor);
        }
        if (actor.targetRow === null) {
          return;
        }
        const target = centerOf(actor.targetRow, actor.targetColumn);
        const deltaX = target.x - actor.x;
        const deltaY = target.y - actor.y;
        const distance = Math.hypot(deltaX, deltaY);
        const movement = speed * delta;
        if (distance <= movement) {
          actor.row = actor.targetRow;
          actor.column = actor.targetColumn;
          actor.x = target.x;
          actor.y = target.y;
          actor.targetRow = null;
          actor.targetColumn = null;
          chooseDirection(actor);
        } else {
          actor.x += deltaX / distance * movement;
          actor.y += deltaY / distance * movement;
        }
      }

      function choosePlayerDirection() {
        if (beginMove(player, player.desiredDirection)) {
          return;
        }
        beginMove(player, player.direction);
      }

      function setDesiredDirection(directionName) {
        player.desiredDirection = directionName;
        if (player.targetRow !== null && OPPOSITE[player.direction] === directionName) {
          const oldRow = player.row;
          const oldColumn = player.column;
          player.row = player.targetRow;
          player.column = player.targetColumn;
          player.targetRow = oldRow;
          player.targetColumn = oldColumn;
          player.direction = directionName;
        }
      }

      function hunterTarget(hunter) {
        if (hunter.eaten) {
          return { row: hunter.spawnRow, column: hunter.spawnColumn };
        }
        if (powerTimer > 0) {
          const corners = [[1, 1], [1, 17], [15, 1], [15, 17]];
          const corner = corners[Math.floor(Math.random() * corners.length)];
          return { row: corner[0], column: corner[1] };
        }
        const direction = DIRECTIONS[player.direction];
        if (hunter.personality === "ambusher") {
          return { row: player.row + direction.row * 4, column: player.column + direction.column * 4 };
        }
        if (hunter.personality === "vector") {
          return { row: player.row + direction.row * 2, column: player.column + direction.column * 2 };
        }
        if (hunter.personality === "shy") {
          const distance = Math.abs(hunter.row - player.row) + Math.abs(hunter.column - player.column);
          return distance > 6 ? { row: player.row, column: player.column } : { row: 15, column: 1 };
        }
        return { row: player.row, column: player.column };
      }

      function chooseHunterDirection(hunter) {
        if (hunter.eaten && hunter.row === hunter.spawnRow && hunter.column === hunter.spawnColumn) {
          hunter.eaten = false;
          hunter.release = 1.2;
          return;
        }
        const choices = Object.keys(DIRECTIONS).filter(directionName => {
          return directionName !== OPPOSITE[hunter.direction] && canMove(hunter.row, hunter.column, directionName);
        });
        if (choices.length === 0) {
          const reverse = OPPOSITE[hunter.direction];
          beginMove(hunter, reverse);
          return;
        }
        if (powerTimer > 0 && !hunter.eaten) {
          beginMove(hunter, choices[Math.floor(Math.random() * choices.length)]);
          return;
        }
        const target = hunterTarget(hunter);
        choices.sort((first, second) => {
          const firstCell = nextCell(hunter.row, hunter.column, first);
          const secondCell = nextCell(hunter.row, hunter.column, second);
          const firstDistance = Math.hypot(firstCell.row - target.row, firstCell.column - target.column);
          const secondDistance = Math.hypot(secondCell.row - target.row, secondCell.column - target.column);
          return firstDistance - secondDistance;
        });
        beginMove(hunter, choices[0]);
      }

      function consumeCurrentCell() {
        const key = keyFor(player.row, player.column);
        if (pellets.delete(key)) {
          score += 10;
          tone(330 + (pellets.size % 2) * 55, 0.025, 0.006, "square", 260);
          updateHud();
        } else if (powerPellets.delete(key)) {
          score += 75;
          powerTimer = Math.max(4.5, 7.5 - stage * 0.25);
          hunterChain = 0;
          for (const hunter of hunters) {
            if (!hunter.eaten && hunter.targetRow !== null) {
              const oldRow = hunter.row;
              const oldColumn = hunter.column;
              hunter.row = hunter.targetRow;
              hunter.column = hunter.targetColumn;
              hunter.targetRow = oldRow;
              hunter.targetColumn = oldColumn;
              hunter.direction = OPPOSITE[hunter.direction];
            }
          }
          const center = centerOf(player.row, player.column);
          burst(center.x, center.y, "#ffe85e", 24, 170);
          showStatus("Power chase activated", 1.2);
          tone(480, 0.25, 0.035, "triangle", 900);
          updateHud();
        }

        const remaining = pellets.size + powerPellets.size;
        if (!fruitSpawned && remaining < startingPelletCount * 0.52) {
          fruitSpawned = true;
          fruit = { row: 9, column: 9, life: 10, phase: 0 };
          showStatus("Bonus signal detected", 1.3);
        }
      }

      function hitPlayer() {
        if (player.invulnerable > 0 || !running) {
          return;
        }
        lives -= 1;
        powerTimer = 0;
        hunterChain = 0;
        burst(player.x, player.y, "#ffe85e", 34, 220);
        shake = 15;
        tone(145, 0.45, 0.05, "sawtooth", 42);
        updateHud();
        if (lives <= 0) {
          endGame();
          return;
        }
        resetActors(2.2);
        showStatus("Runner restored", 1.4);
      }

      function eatHunter(hunter) {
        hunter.eaten = true;
        hunterChain += 1;
        const points = 200 * 2 ** Math.min(3, hunterChain - 1);
        score += points;
        const center = centerOf(hunter.row, hunter.column);
        burst(center.x, center.y, hunter.color, 24, 190);
        showStatus(`Hunter captured +${points}`, 1.1);
        tone(620 + hunterChain * 90, 0.18, 0.03, "triangle", 980);
        updateHud();
      }

      function completeStage() {
        if (stageTimer > 0) {
          return;
        }
        const bonus = stage * 900 + lives * 250;
        score += bonus;
        stageTimer = 1.8;
        showStatus(`Maze clear +${bonus.toLocaleString()}`, 1.8);
        tone(430, 0.35, 0.035, "triangle", 920);
        updateHud();
      }

      function update(delta) {
        if (!running || paused) {
          return;
        }
        statusTimer = Math.max(0, statusTimer - delta);
        player.invulnerable = Math.max(0, player.invulnerable - delta);
        if (powerTimer > 0) {
          powerTimer = Math.max(0, powerTimer - delta);
          if (powerTimer === 0) {
            hunterChain = 0;
          }
        }

        if (stageTimer > 0) {
          stageTimer -= delta;
          if (stageTimer <= 0) {
            stage += 1;
            createStage();
          }
          updateStatus();
          return;
        }

        moveActor(player, player.speed + Math.min(22, stage * 2), delta, choosePlayerDirection);
        consumeCurrentCell();

        for (const hunter of hunters) {
          if (hunter.release > 0) {
            hunter.release = Math.max(0, hunter.release - delta);
            continue;
          }
          const speed = hunter.eaten
            ? 180
            : powerTimer > 0
              ? 82
              : Math.min(145, 102 + stage * 4);
          moveActor(hunter, speed, delta, chooseHunterDirection);
          if (hunter.eaten && hunter.row === hunter.spawnRow && hunter.column === hunter.spawnColumn
              && hunter.targetRow === null) {
            hunter.eaten = false;
            hunter.release = 1.2;
          }
          if (Math.hypot(hunter.x - player.x, hunter.y - player.y) < 19) {
            if (powerTimer > 0 && !hunter.eaten) {
              eatHunter(hunter);
            } else if (!hunter.eaten) {
              hitPlayer();
            }
          }
        }

        if (fruit) {
          fruit.life -= delta;
          fruit.phase += delta * 4;
          if (fruit.row === player.row && fruit.column === player.column) {
            const center = centerOf(fruit.row, fruit.column);
            score += 1000 + stage * 100;
            burst(center.x, center.y, "#ff607f", 26, 185);
            showStatus(`Bonus captured +${1000 + stage * 100}`, 1.3);
            tone(560, 0.24, 0.035, "triangle", 980);
            fruit = null;
            updateHud();
          } else if (fruit.life <= 0) {
            fruit = null;
          }
        }

        for (let index = particles.length - 1; index >= 0; index -= 1) {
          const particle = particles[index];
          particle.x += particle.vx * delta;
          particle.y += particle.vy * delta;
          particle.life -= delta;
          if (particle.life <= 0) {
            particles.splice(index, 1);
          }
        }

        if (pellets.size === 0 && powerPellets.size === 0) {
          completeStage();
        }
        shake *= Math.pow(0.012, delta);
        updateStatus();
      }

      function drawBackground(time) {
        context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
        const gradient = context.createLinearGradient(0, 0, 0, viewportHeight);
        gradient.addColorStop(0, "#071022");
        gradient.addColorStop(0.72, "#03050d");
        gradient.addColorStop(1, "#010207");
        context.fillStyle = gradient;
        context.fillRect(0, 0, viewportWidth, viewportHeight);
        context.setTransform(pixelRatio * viewScale, 0, 0, pixelRatio * viewScale,
                             pixelRatio * viewOffsetX, pixelRatio * viewOffsetY);
        for (const star of stars) {
          const alpha = 0.14 + Math.sin(time * 0.0016 + star.phase) * 0.07;
          context.fillStyle = `rgba(164, 226, 255, ${alpha})`;
          context.fillRect(star.x, star.y, star.size, star.size);
        }
      }

      function drawMaze(time) {
        context.fillStyle = "rgba(4, 8, 18, .94)";
        context.fillRect(MAZE_X, MAZE_Y, COLUMNS * TILE, ROWS * TILE);
        for (let row = 0; row < ROWS; row += 1) {
          for (let column = 0; column < COLUMNS; column += 1) {
            if (!isWall(row, column)) {
              continue;
            }
            const x = MAZE_X + column * TILE;
            const y = MAZE_Y + row * TILE;
            context.fillStyle = "#101837";
            context.fillRect(x + 2, y + 2, TILE - 4, TILE - 4);
            context.strokeStyle = (row + column) % 3 === 0 ? "#675cff" : "#2f78df";
            context.lineWidth = 1.5;
            context.strokeRect(x + 5, y + 5, TILE - 10, TILE - 10);
          }
        }

        context.fillStyle = "#78fbff";
        for (const key of pellets) {
          const [row, column] = key.split(":").map(Number);
          const center = centerOf(row, column);
          context.fillRect(center.x - 2, center.y - 2, 4, 4);
        }
        const powerSize = 6 + Math.sin(time * 0.009) * 2;
        context.fillStyle = "#ffe85e";
        for (const key of powerPellets) {
          const [row, column] = key.split(":").map(Number);
          const center = centerOf(row, column);
          context.beginPath();
          context.arc(center.x, center.y, powerSize, 0, TAU);
          context.fill();
        }
      }

      function drawPlayer(time) {
        if (player.invulnerable > 0 && Math.floor(player.invulnerable * 12) % 2 === 0) {
          return;
        }
        const angle = DIRECTIONS[player.direction].angle;
        const mouth = 0.16 + Math.abs(Math.sin(time * 0.012)) * 0.24;
        context.fillStyle = "#ffe85e";
        context.beginPath();
        context.moveTo(player.x, player.y);
        context.arc(player.x, player.y, 13, angle + mouth, angle + TAU - mouth);
        context.closePath();
        context.fill();
      }

      function drawHunter(hunter, time) {
        const frightened = powerTimer > 0 && !hunter.eaten;
        const flashing = frightened && powerTimer < 2 && Math.floor(time * 0.012) % 2 === 0;
        const color = hunter.eaten ? "rgba(180, 239, 255, .45)" : frightened ? (flashing ? "#eefcff" : "#4e68ff") : hunter.color;
        context.fillStyle = color;
        context.beginPath();
        context.arc(hunter.x, hunter.y - 3, 13, Math.PI, 0);
        context.lineTo(hunter.x + 13, hunter.y + 12);
        context.lineTo(hunter.x + 7, hunter.y + 7);
        context.lineTo(hunter.x, hunter.y + 12);
        context.lineTo(hunter.x - 7, hunter.y + 7);
        context.lineTo(hunter.x - 13, hunter.y + 12);
        context.closePath();
        context.fill();
        context.fillStyle = "#f6ffff";
        context.fillRect(hunter.x - 8, hunter.y - 5, 5, 7);
        context.fillRect(hunter.x + 3, hunter.y - 5, 5, 7);
        const eyeDirection = DIRECTIONS[hunter.direction];
        context.fillStyle = frightened ? "#152061" : "#102038";
        context.fillRect(hunter.x - 7 + eyeDirection.column * 2, hunter.y - 2 + eyeDirection.row * 2, 2, 3);
        context.fillRect(hunter.x + 4 + eyeDirection.column * 2, hunter.y - 2 + eyeDirection.row * 2, 2, 3);
      }

      function drawFruit(time) {
        if (!fruit) {
          return;
        }
        const center = centerOf(fruit.row, fruit.column);
        const bob = Math.sin(time * 0.008 + fruit.phase) * 2;
        context.fillStyle = "#ff5f7f";
        context.beginPath();
        context.arc(center.x - 6, center.y + bob, 7, 0, TAU);
        context.arc(center.x + 6, center.y + bob, 7, 0, TAU);
        context.fill();
        context.strokeStyle = "#69f89a";
        context.lineWidth = 2;
        context.beginPath();
        context.moveTo(center.x, center.y - 4 + bob);
        context.lineTo(center.x + 5, center.y - 13 + bob);
        context.stroke();
      }

      function draw(time) {
        drawBackground(time);
        const shakeX = (Math.random() - 0.5) * shake;
        const shakeY = (Math.random() - 0.5) * shake;
        context.save();
        context.translate(shakeX, shakeY);
        drawMaze(time);
        drawFruit(time);
        for (const hunter of hunters) {
          drawHunter(hunter, time);
        }
        drawPlayer(time);

        context.globalCompositeOperation = "lighter";
        for (const particle of particles) {
          const alpha = Math.max(0, particle.life / particle.maxLife);
          context.globalAlpha = alpha;
          context.fillStyle = particle.color;
          context.fillRect(particle.x, particle.y, particle.size, particle.size);
        }
        context.globalAlpha = 1;
        context.globalCompositeOperation = "source-over";
        context.restore();

        if (stageTimer > 0 && running) {
          context.fillStyle = "rgba(224, 253, 255, .84)";
          context.font = "800 13px ui-monospace, monospace";
          context.textAlign = "center";
          context.fillText(`STAGE ${String(stage + 1).padStart(2, "0")} INBOUND`, WORLD_WIDTH / 2, WORLD_HEIGHT / 2);
        }
        if (paused && running) {
          context.fillStyle = "rgba(2, 4, 12, .74)";
          context.fillRect(MAZE_X, MAZE_Y, COLUMNS * TILE, ROWS * TILE);
          context.fillStyle = "#e4feff";
          context.font = "800 22px ui-monospace, monospace";
          context.textAlign = "center";
          context.fillText("MAZE PAUSED", WORLD_WIDTH / 2, WORLD_HEIGHT / 2);
        }
      }

      function frame(time) {
        const delta = Math.min((time - lastTime) / 1000, 0.04);
        lastTime = time;
        update(delta);
        draw(time);
        requestAnimationFrame(frame);
      }

      function directionForCode(code) {
        if (code === "KeyA" || code === "ArrowLeft") {
          return "left";
        }
        if (code === "KeyD" || code === "ArrowRight") {
          return "right";
        }
        if (code === "KeyW" || code === "ArrowUp") {
          return "up";
        }
        if (code === "KeyS" || code === "ArrowDown") {
          return "down";
        }
        return null;
      }

      window.addEventListener("resize", resize);
      window.addEventListener("keydown", event => {
        if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(event.code)) {
          event.preventDefault();
        }
        if (!running && event.code === "Enter") {
          startGame();
          return;
        }
        if (event.code === "KeyP" && !event.repeat && running) {
          paused = !paused;
          showStatus(paused ? "Maze paused" : "Maze resumed", 1);
          return;
        }
        const direction = directionForCode(event.code);
        if (direction) {
          setDesiredDirection(direction);
        }
      });
      window.addEventListener("blur", () => {
        if (running) {
          paused = true;
        }
      });
      canvas.addEventListener("pointerdown", event => {
        swipeStart = { x: event.clientX, y: event.clientY };
      });
      canvas.addEventListener("pointerup", event => {
        if (!swipeStart) {
          return;
        }
        const deltaX = event.clientX - swipeStart.x;
        const deltaY = event.clientY - swipeStart.y;
        swipeStart = null;
        if (Math.hypot(deltaX, deltaY) < 12) {
          return;
        }
        setDesiredDirection(Math.abs(deltaX) > Math.abs(deltaY)
          ? deltaX < 0 ? "left" : "right"
          : deltaY < 0 ? "up" : "down");
      });
      canvas.addEventListener("contextmenu", event => event.preventDefault());
      startButton.addEventListener("click", startGame);

      resize();
      createStage();
      running = false;
      updateHud();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
