<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#02040a">
  <title>Neon Bomber</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #02040a;
      color: #f4feff;
      user-select: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: default;
      touch-action: none;
    }

    .hud {
      position: fixed;
      inset: 0;
      padding: 20px 24px;
      pointer-events: none;
    }

    .hud-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      color: #65faff;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .32em;
    }

    .stats {
      display: flex;
      gap: 28px;
      color: #748da0;
      font-size: 9px;
      letter-spacing: .2em;
      text-align: right;
      text-transform: uppercase;
    }

    .stats strong {
      display: block;
      margin-top: 4px;
      color: #f7ffff;
      font-size: 19px;
      letter-spacing: .04em;
    }

    .lives {
      position: absolute;
      bottom: 20px;
      left: 24px;
      color: #7890a4;
      font-size: 9px;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .lives-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .life {
      width: 13px;
      height: 13px;
      border: 2px solid #62faff;
      transform: rotate(45deg);
    }

    .status {
      position: absolute;
      bottom: 20px;
      left: 50%;
      color: #ff8cde;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .14em;
      text-align: center;
      text-transform: uppercase;
      transform: translateX(-50%);
    }

    .hint {
      position: absolute;
      right: 24px;
      bottom: 20px;
      color: rgba(179, 209, 226, .55);
      font-size: 9px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      background: radial-gradient(circle at center, rgba(7, 27, 45, .5), rgba(1, 2, 8, .93));
      transition: opacity .2s ease;
    }

    .overlay.hidden {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .card {
      position: relative;
      isolation: isolate;
      width: min(560px, 93vw);
      padding: 44px;
      background: rgba(91, 241, 255, .5);
      text-align: center;
      clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px);
    }

    .card::before {
      position: absolute;
      z-index: -1;
      inset: 1px;
      background: linear-gradient(145deg, rgba(8, 25, 42, .99), rgba(7, 5, 20, .99));
      clip-path: polygon(19.5px 0, 100% 0, 100% calc(100% - 19.5px), calc(100% - 19.5px) 100%, 0 100%, 0 19.5px);
      content: "";
    }

    .eyebrow {
      color: #c3a3ff;
      font-size: 10px;
      letter-spacing: .42em;
      text-transform: uppercase;
    }

    h1 {
      margin: 12px 0 8px;
      color: #f7ffff;
      font-size: clamp(42px, 8vw, 70px);
      font-weight: 950;
      letter-spacing: -.07em;
      line-height: .9;
      text-shadow: 7px 5px 0 rgba(151, 57, 255, .28);
    }

    .subtitle {
      margin: 17px auto 26px;
      color: #9ab2c4;
      font-size: 12px;
      line-height: 1.7;
    }

    button {
      min-width: 200px;
      padding: 13px 24px;
      border: 1px solid #62f7ff;
      background: rgba(5, 35, 48, .9);
      color: #efffff;
      font: 800 12px/1 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      letter-spacing: .23em;
      text-transform: uppercase;
      cursor: pointer;
    }

    button:hover {
      background: rgba(12, 72, 85, .96);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 17px;
      margin-top: 25px;
      color: #70879a;
      font-size: 9px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .controls span {
      color: #e2fcff;
    }

    @media (max-width: 680px) {
      .stats {
        gap: 12px;
      }

      .stats strong {
        font-size: 15px;
      }

      .hint {
        display: none;
      }

      .card {
        padding: 34px 25px;
      }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div class="hud">
    <div class="hud-row">
      <div class="brand">NEON // BOMBER</div>
      <div class="stats">
        <div>Score<strong id="score">000000</strong></div>
        <div>Stage<strong id="stage">01</strong></div>
        <div>Targets<strong id="targets">00</strong></div>
      </div>
    </div>
    <div class="lives">Reserve units<div class="lives-row" id="lives"></div></div>
    <div class="status" id="status"></div>
    <div class="hint">WASD / arrows move · Space plant bomb · P pause</div>
  </div>

  <div class="overlay" id="overlay">
    <div class="card">
      <div class="eyebrow" id="eyebrow">Demolition grid synchronized</div>
      <h1 id="title">NEON<br>BOMBER</h1>
      <p class="subtitle" id="subtitle">Clear the hostiles, uncover the exit, and escape.<br>Every bomb can trigger another. Do not stand too close.</p>
      <button id="start">Enter grid</button>
      <div class="controls">
        <div><span>WASD</span> move</div>
        <div><span>Arrows</span> move</div>
        <div><span>Space</span> bomb</div>
        <div><span>P</span> pause</div>
      </div>
    </div>
  </div>

  <script>
    (() => {
      "use strict";

      const WORLD_WIDTH = 960;
      const WORLD_HEIGHT = 720;
      const COLUMNS = 15;
      const ROWS = 11;
      const TILE = 48;
      const FIELD_X = 120;
      const FIELD_Y = 96;
      const TAU = Math.PI * 2;
      const DIRECTIONS = [
        { row: -1, column: 0 },
        { row: 1, column: 0 },
        { row: 0, column: -1 },
        { row: 0, column: 1 },
      ];

      const canvas = document.getElementById("game");
      const context = canvas.getContext("2d");
      const overlay = document.getElementById("overlay");
      const startButton = document.getElementById("start");
      const eyebrowNode = document.getElementById("eyebrow");
      const titleNode = document.getElementById("title");
      const subtitleNode = document.getElementById("subtitle");
      const scoreNode = document.getElementById("score");
      const stageNode = document.getElementById("stage");
      const targetsNode = document.getElementById("targets");
      const livesNode = document.getElementById("lives");
      const statusNode = document.getElementById("status");

      const keys = new Set();
      const crates = new Set();
      const bombs = [];
      const explosions = [];
      const enemies = [];
      const powerups = [];
      const particles = [];
      const stars = [];
      const player = {
        x: 0,
        y: 0,
        radius: 13,
        invulnerable: 0,
      };

      let viewportWidth = innerWidth;
      let viewportHeight = innerHeight;
      let pixelRatio = 1;
      let viewScale = 1;
      let viewOffsetX = 0;
      let viewOffsetY = 0;
      let running = false;
      let paused = false;
      let score = 0;
      let stage = 1;
      let lives = 3;
      let bombCapacity = 1;
      let bombRange = 2;
      let moveSpeed = 175;
      let shield = 0;
      let exitKey = "";
      let exitRevealed = false;
      let stageTimer = 0;
      let statusTimer = 0;
      let statusText = "";
      let shake = 0;
      let lastTime = performance.now();
      let audioContext = null;

      function resize() {
        viewportWidth = innerWidth;
        viewportHeight = innerHeight;
        pixelRatio = Math.min(devicePixelRatio || 1, 2);
        canvas.width = Math.floor(viewportWidth * pixelRatio);
        canvas.height = Math.floor(viewportHeight * pixelRatio);
        viewScale = Math.min(viewportWidth / WORLD_WIDTH, viewportHeight / WORLD_HEIGHT);
        viewOffsetX = (viewportWidth - WORLD_WIDTH * viewScale) / 2;
        viewOffsetY = (viewportHeight - WORLD_HEIGHT * viewScale) / 2;
        context.imageSmoothingEnabled = false;

        stars.length = 0;
        for (let index = 0; index < 90; index += 1) {
          stars.push({
            x: Math.random() * WORLD_WIDTH,
            y: Math.random() * WORLD_HEIGHT,
            size: Math.random() > 0.82 ? 2 : 1,
            phase: Math.random() * TAU,
          });
        }
      }

      function tone(frequency, duration, volume = 0.02, type = "square", endFrequency = frequency * 0.7) {
        if (!audioContext) {
          return;
        }
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        oscillator.type = type;
        oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);
        oscillator.frequency.exponentialRampToValueAtTime(Math.max(35, endFrequency), audioContext.currentTime + duration);
        gain.gain.setValueAtTime(volume, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + duration);
        oscillator.connect(gain).connect(audioContext.destination);
        oscillator.start();
        oscillator.stop(audioContext.currentTime + duration);
      }

      function burst(x, y, color, amount, speed = 130) {
        for (let index = 0; index < amount; index += 1) {
          const angle = Math.random() * TAU;
          const velocity = speed * (0.25 + Math.random() * 0.85);
          const life = 0.25 + Math.random() * 0.5;
          particles.push({
            x,
            y,
            vx: Math.cos(angle) * velocity,
            vy: Math.sin(angle) * velocity,
            life,
            maxLife: life,
            size: 1 + Math.random() * 3,
            color,
          });
        }
      }

      function keyFor(row, column) {
        return `${row}:${column}`;
      }

      function centerOf(row, column) {
        return {
          x: FIELD_X + column * TILE + TILE / 2,
          y: FIELD_Y + row * TILE + TILE / 2,
        };
      }

      function tileAt(x, y) {
        return {
          row: Math.floor((y - FIELD_Y) / TILE),
          column: Math.floor((x - FIELD_X) / TILE),
        };
      }

      function isHardWall(row, column) {
        if (row < 0 || row >= ROWS || column < 0 || column >= COLUMNS) {
          return true;
        }
        return row === 0 || column === 0 || row === ROWS - 1 || column === COLUMNS - 1
          || (row % 2 === 0 && column % 2 === 0);
      }

      function bombAt(row, column) {
        return bombs.find(bomb => bomb.row === row && bomb.column === column);
      }

      function isSolid(row, column, forPlayer = false) {
        if (isHardWall(row, column) || crates.has(keyFor(row, column))) {
          return true;
        }
        const bomb = bombAt(row, column);
        return Boolean(bomb && !(forPlayer && bomb.playerCanPass));
      }

      function canOccupy(x, y, radius, forPlayer = false) {
        const samples = [
          tileAt(x - radius, y - radius),
          tileAt(x + radius, y - radius),
          tileAt(x - radius, y + radius),
          tileAt(x + radius, y + radius),
        ];
        return samples.every(tile => !isSolid(tile.row, tile.column, forPlayer));
      }

      function playerOverlapsBombTile(bomb) {
        const center = centerOf(bomb.row, bomb.column);
        return Math.abs(player.x - center.x) < TILE / 2 + player.radius
          && Math.abs(player.y - center.y) < TILE / 2 + player.radius;
      }

      function resetBonuses() {
        bombCapacity = 1;
        bombRange = 2;
        moveSpeed = 175;
        shield = 0;
      }

      function resetPlayer(invulnerable = 2) {
        const spawn = centerOf(1, 1);
        player.x = spawn.x;
        player.y = spawn.y;
        player.invulnerable = invulnerable;
      }

      function createStage() {
        crates.clear();
        bombs.length = 0;
        explosions.length = 0;
        enemies.length = 0;
        powerups.length = 0;
        const safe = new Set([keyFor(1, 1), keyFor(1, 2), keyFor(2, 1)]);
        const crateCandidates = [];

        for (let row = 1; row < ROWS - 1; row += 1) {
          for (let column = 1; column < COLUMNS - 1; column += 1) {
            const key = keyFor(row, column);
            if (!isHardWall(row, column) && !safe.has(key) && Math.random() < Math.min(0.58 + stage * 0.012, 0.72)) {
              crates.add(key);
              crateCandidates.push(key);
            }
          }
        }

        if (crateCandidates.length === 0) {
          const fallback = keyFor(1, 3);
          crates.add(fallback);
          crateCandidates.push(fallback);
        }
        exitKey = crateCandidates[Math.floor(Math.random() * crateCandidates.length)];
        exitRevealed = false;

        const enemyCount = Math.min(3 + stage, 10);
        const spawnCells = [];
        for (let row = 1; row < ROWS - 1; row += 1) {
          for (let column = 1; column < COLUMNS - 1; column += 1) {
            const key = keyFor(row, column);
            if (!isHardWall(row, column) && !crates.has(key) && row + column >= 8) {
              spawnCells.push({ row, column });
            }
          }
        }
        for (const key of crateCandidates) {
          if (spawnCells.length >= enemyCount) {
            break;
          }
          if (key === exitKey) {
            continue;
          }
          const [row, column] = key.split(":").map(Number);
          if (row + column >= 8) {
            crates.delete(key);
            spawnCells.push({ row, column });
          }
        }
        spawnCells.sort(() => Math.random() - 0.5);
        for (let index = 0; index < Math.min(enemyCount, spawnCells.length); index += 1) {
          const { row, column } = spawnCells[index];
          const center = centerOf(row, column);
          enemies.push({
            row,
            column,
            x: center.x,
            y: center.y,
            targetRow: null,
            targetColumn: null,
            speed: Math.min(160, 78 + stage * 7 + Math.random() * 18),
            color: index % 3 === 0 ? "#ff5eab" : index % 3 === 1 ? "#a778ff" : "#ffae47",
            phase: Math.random() * TAU,
          });
        }
        resetPlayer();
        showStatus(`Stage ${String(stage).padStart(2, "0")} — exit signal hidden`, 2);
        updateHud();
      }

      function resetGame() {
        score = 0;
        stage = 1;
        lives = 3;
        statusTimer = 0;
        stageTimer = 0;
        particles.length = 0;
        shake = 0;
        running = true;
        paused = false;
        resetBonuses();
        createStage();
      }

      function startGame() {
        if (!audioContext) {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
        audioContext.resume();
        overlay.classList.add("hidden");
        resetGame();
      }

      function endGame() {
        running = false;
        paused = false;
        eyebrowNode.textContent = "Demolition link terminated";
        titleNode.innerHTML = "GRID<br>OFFLINE";
        subtitleNode.innerHTML = `Final score: <strong>${score.toLocaleString()}</strong><br>Stage reached: ${String(stage).padStart(2, "0")}`;
        startButton.textContent = "Enter again";
        overlay.classList.remove("hidden");
        tone(120, 0.7, 0.055, "sawtooth", 38);
      }

      function updateHud() {
        scoreNode.textContent = String(score).padStart(6, "0");
        stageNode.textContent = String(stage).padStart(2, "0");
        targetsNode.textContent = String(enemies.length).padStart(2, "0");
        livesNode.replaceChildren();
        for (let index = 0; index < lives; index += 1) {
          const life = document.createElement("span");
          life.className = "life";
          livesNode.appendChild(life);
        }
      }

      function showStatus(text, duration = 1.5) {
        statusText = text;
        statusTimer = duration;
      }

      function updateStatus() {
        const systems = [`bombs ${bombCapacity}`, `range ${bombRange}`];
        if (moveSpeed > 175) {
          systems.push("speed+");
        }
        if (shield > 0) {
          systems.push(`shield ×${shield}`);
        }
        statusNode.textContent = statusTimer > 0 ? statusText : systems.join(" · ");
      }

      function placeBomb() {
        if (!running || paused || stageTimer > 0 || bombs.length >= bombCapacity) {
          return;
        }
        const tile = tileAt(player.x, player.y);
        if (bombAt(tile.row, tile.column)) {
          return;
        }
        bombs.push({
          row: tile.row,
          column: tile.column,
          timer: 2.25,
          range: bombRange,
          playerCanPass: true,
        });
        tone(180, 0.06, 0.014, "square", 130);
      }

      function addExplosion(row, column) {
        const existing = explosions.find(explosion => explosion.row === row && explosion.column === column);
        if (existing) {
          existing.life = Math.max(existing.life, 0.48);
        } else {
          explosions.push({ row, column, life: 0.48 });
        }
        const chainedBomb = bombAt(row, column);
        if (chainedBomb) {
          detonateBomb(chainedBomb);
        }
      }

      function maybeDropPowerup(row, column) {
        if (Math.random() > 0.22) {
          return;
        }
        const roll = Math.random();
        const type = roll < 0.3 ? "bomb" : roll < 0.6 ? "range" : roll < 0.84 ? "speed" : "shield";
        powerups.push({ row, column, type, phase: Math.random() * TAU });
      }

      function destroyCrate(row, column) {
        const key = keyFor(row, column);
        crates.delete(key);
        const center = centerOf(row, column);
        burst(center.x, center.y, "#ff67c7", 16, 145);
        score += 35;
        if (key === exitKey) {
          exitRevealed = true;
          showStatus("Exit signal uncovered", 1.8);
          tone(390, 0.25, 0.03, "triangle", 760);
        } else {
          maybeDropPowerup(row, column);
        }
      }

      function detonateBomb(bomb) {
        const index = bombs.indexOf(bomb);
        if (index < 0) {
          return;
        }
        bombs.splice(index, 1);
        addExplosion(bomb.row, bomb.column);
        for (const direction of DIRECTIONS) {
          for (let distance = 1; distance <= bomb.range; distance += 1) {
            const row = bomb.row + direction.row * distance;
            const column = bomb.column + direction.column * distance;
            if (isHardWall(row, column)) {
              break;
            }
            const key = keyFor(row, column);
            addExplosion(row, column);
            if (crates.has(key)) {
              destroyCrate(row, column);
              break;
            }
          }
        }
        const center = centerOf(bomb.row, bomb.column);
        burst(center.x, center.y, "#ff9d36", 28, 230);
        shake = Math.max(shake, 8);
        tone(105, 0.28, 0.04, "sawtooth", 42);
        updateHud();
      }

      function chooseEnemyTarget(enemy) {
        const candidates = DIRECTIONS.filter(direction => {
          const row = enemy.row + direction.row;
          const column = enemy.column + direction.column;
          return !isSolid(row, column);
        });
        if (candidates.length === 0) {
          enemy.targetRow = null;
          enemy.targetColumn = null;
          return;
        }
        const playerTile = tileAt(player.x, player.y);
        candidates.sort((first, second) => {
          const firstDistance = Math.abs(enemy.row + first.row - playerTile.row)
            + Math.abs(enemy.column + first.column - playerTile.column);
          const secondDistance = Math.abs(enemy.row + second.row - playerTile.row)
            + Math.abs(enemy.column + second.column - playerTile.column);
          return firstDistance - secondDistance;
        });
        const direction = Math.random() < Math.min(0.32 + stage * 0.025, 0.68)
          ? candidates[0]
          : candidates[Math.floor(Math.random() * candidates.length)];
        enemy.targetRow = enemy.row + direction.row;
        enemy.targetColumn = enemy.column + direction.column;
      }

      function updateEnemy(enemy, delta) {
        if (enemy.targetRow === null || isSolid(enemy.targetRow, enemy.targetColumn)) {
          chooseEnemyTarget(enemy);
        }
        if (enemy.targetRow === null) {
          return;
        }
        const target = centerOf(enemy.targetRow, enemy.targetColumn);
        const deltaX = target.x - enemy.x;
        const deltaY = target.y - enemy.y;
        const distance = Math.hypot(deltaX, deltaY);
        const movement = enemy.speed * delta;
        if (distance <= movement) {
          enemy.x = target.x;
          enemy.y = target.y;
          enemy.row = enemy.targetRow;
          enemy.column = enemy.targetColumn;
          enemy.targetRow = null;
          enemy.targetColumn = null;
          chooseEnemyTarget(enemy);
        } else {
          enemy.x += deltaX / distance * movement;
          enemy.y += deltaY / distance * movement;
        }
        enemy.phase += delta * 6;
      }

      function collectPowerup(index) {
        const powerup = powerups[index];
        powerups.splice(index, 1);
        if (powerup.type === "bomb") {
          bombCapacity = Math.min(6, bombCapacity + 1);
          showStatus("Bomb capacity increased", 1.5);
        } else if (powerup.type === "range") {
          bombRange = Math.min(7, bombRange + 1);
          showStatus("Blast range increased", 1.5);
        } else if (powerup.type === "speed") {
          moveSpeed = Math.min(275, moveSpeed + 22);
          showStatus("Movement speed increased", 1.5);
        } else {
          shield = Math.min(3, shield + 1);
          showStatus("Blast shield charged", 1.5);
        }
        const center = centerOf(powerup.row, powerup.column);
        burst(center.x, center.y, powerupColor(powerup.type), 24, 190);
        score += 200;
        tone(520, 0.24, 0.035, "triangle", 940);
        updateHud();
      }

      function powerupColor(type) {
        if (type === "bomb") {
          return "#ff6dcc";
        }
        if (type === "range") {
          return "#ffac42";
        }
        if (type === "speed") {
          return "#62faff";
        }
        return "#9b7cff";
      }

      function hitPlayer() {
        if (player.invulnerable > 0 || !running) {
          return;
        }
        if (shield > 0) {
          shield -= 1;
          player.invulnerable = 1;
          burst(player.x, player.y, "#9a7cff", 24, 190);
          showStatus("Shield absorbed blast", 1.2);
          tone(280, 0.2, 0.03, "triangle", 760);
          return;
        }
        lives -= 1;
        resetBonuses();
        bombs.length = 0;
        explosions.length = 0;
        burst(player.x, player.y, "#62faff", 38, 245);
        shake = 18;
        tone(145, 0.45, 0.05, "sawtooth", 42);
        updateHud();
        if (lives <= 0) {
          endGame();
          return;
        }
        resetPlayer(2.2);
        showStatus("New unit deployed — systems reset", 1.8);
      }

      function explosionAt(row, column) {
        return explosions.some(explosion => explosion.row === row && explosion.column === column);
      }

      function completeStage() {
        if (stageTimer > 0) {
          return;
        }
        const bonus = stage * 800 + lives * 250;
        score += bonus;
        stageTimer = 1.8;
        bombs.length = 0;
        explosions.length = 0;
        showStatus(`Stage clear +${bonus.toLocaleString()}`, 1.8);
        tone(430, 0.35, 0.035, "triangle", 920);
        updateHud();
      }

      function update(delta) {
        if (!running || paused) {
          return;
        }
        statusTimer = Math.max(0, statusTimer - delta);
        player.invulnerable = Math.max(0, player.invulnerable - delta);

        if (stageTimer > 0) {
          stageTimer -= delta;
          if (stageTimer <= 0) {
            stage += 1;
            createStage();
          }
          updateStatus();
          return;
        }

        let directionX = (keys.has("KeyD") || keys.has("ArrowRight") ? 1 : 0)
          - (keys.has("KeyA") || keys.has("ArrowLeft") ? 1 : 0);
        let directionY = (keys.has("KeyS") || keys.has("ArrowDown") ? 1 : 0)
          - (keys.has("KeyW") || keys.has("ArrowUp") ? 1 : 0);
        if (directionX !== 0 && directionY !== 0) {
          directionX *= Math.SQRT1_2;
          directionY *= Math.SQRT1_2;
        }
        const nextX = player.x + directionX * moveSpeed * delta;
        const nextY = player.y + directionY * moveSpeed * delta;
        if (canOccupy(nextX, player.y, player.radius, true)) {
          player.x = nextX;
        }
        if (canOccupy(player.x, nextY, player.radius, true)) {
          player.y = nextY;
        }

        const playerTile = tileAt(player.x, player.y);
        for (const bomb of bombs) {
          if (bomb.playerCanPass && !playerOverlapsBombTile(bomb)) {
            bomb.playerCanPass = false;
          }
          bomb.timer -= delta;
        }
        for (let index = bombs.length - 1; index >= 0; index -= 1) {
          if (bombs[index].timer <= 0) {
            detonateBomb(bombs[index]);
          }
        }

        for (let index = explosions.length - 1; index >= 0; index -= 1) {
          explosions[index].life -= delta;
          if (explosions[index].life <= 0) {
            explosions.splice(index, 1);
          }
        }

        if (explosionAt(playerTile.row, playerTile.column)) {
          hitPlayer();
        }

        for (let index = enemies.length - 1; index >= 0; index -= 1) {
          const enemy = enemies[index];
          updateEnemy(enemy, delta);
          const tile = tileAt(enemy.x, enemy.y);
          if (explosionAt(tile.row, tile.column)) {
            enemies.splice(index, 1);
            score += 300 + stage * 25;
            burst(enemy.x, enemy.y, enemy.color, 22, 180);
            tone(220, 0.12, 0.025, "square", 480);
            updateHud();
            continue;
          }
          if (Math.hypot(enemy.x - player.x, enemy.y - player.y) < player.radius + 15) {
            hitPlayer();
          }
        }

        for (let index = powerups.length - 1; index >= 0; index -= 1) {
          const powerup = powerups[index];
          powerup.phase += delta * 3;
          if (powerup.row === playerTile.row && powerup.column === playerTile.column) {
            collectPowerup(index);
          }
        }

        for (let index = particles.length - 1; index >= 0; index -= 1) {
          const particle = particles[index];
          particle.x += particle.vx * delta;
          particle.y += particle.vy * delta;
          particle.life -= delta;
          if (particle.life <= 0) {
            particles.splice(index, 1);
          }
        }

        if (exitRevealed && enemies.length === 0 && keyFor(playerTile.row, playerTile.column) === exitKey) {
          completeStage();
        } else if (exitRevealed && enemies.length > 0 && keyFor(playerTile.row, playerTile.column) === exitKey) {
          showStatus(`${enemies.length} target${enemies.length === 1 ? "" : "s"} remaining`, 0.35);
        }
        shake *= Math.pow(0.012, delta);
        updateStatus();
      }

      function drawBackground(time) {
        context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
        const gradient = context.createLinearGradient(0, 0, 0, viewportHeight);
        gradient.addColorStop(0, "#071022");
        gradient.addColorStop(0.72, "#03050d");
        gradient.addColorStop(1, "#010207");
        context.fillStyle = gradient;
        context.fillRect(0, 0, viewportWidth, viewportHeight);
        context.setTransform(pixelRatio * viewScale, 0, 0, pixelRatio * viewScale,
                             pixelRatio * viewOffsetX, pixelRatio * viewOffsetY);
        for (const star of stars) {
          const alpha = 0.14 + Math.sin(time * 0.0016 + star.phase) * 0.07;
          context.fillStyle = `rgba(164, 226, 255, ${alpha})`;
          context.fillRect(star.x, star.y, star.size, star.size);
        }
      }

      function drawFloor() {
        context.fillStyle = "rgba(7, 14, 28, .92)";
        context.fillRect(FIELD_X, FIELD_Y, COLUMNS * TILE, ROWS * TILE);
        context.strokeStyle = "rgba(117, 239, 255, .08)";
        context.lineWidth = 1;
        context.beginPath();
        for (let column = 0; column <= COLUMNS; column += 1) {
          const x = FIELD_X + column * TILE;
          context.moveTo(x, FIELD_Y);
          context.lineTo(x, FIELD_Y + ROWS * TILE);
        }
        for (let row = 0; row <= ROWS; row += 1) {
          const y = FIELD_Y + row * TILE;
          context.moveTo(FIELD_X, y);
          context.lineTo(FIELD_X + COLUMNS * TILE, y);
        }
        context.stroke();
      }

      function drawHardWall(row, column) {
        const x = FIELD_X + column * TILE;
        const y = FIELD_Y + row * TILE;
        context.fillStyle = "#182247";
        context.fillRect(x + 2, y + 2, TILE - 4, TILE - 4);
        context.strokeStyle = "#536cff";
        context.lineWidth = 2;
        context.strokeRect(x + 5, y + 5, TILE - 10, TILE - 10);
        context.fillStyle = "rgba(117, 151, 255, .34)";
        context.fillRect(x + 8, y + 8, TILE - 16, 4);
      }

      function drawCrate(row, column) {
        const x = FIELD_X + column * TILE;
        const y = FIELD_Y + row * TILE;
        context.fillStyle = "#421953";
        context.fillRect(x + 4, y + 4, TILE - 8, TILE - 8);
        context.strokeStyle = "#ff62c8";
        context.lineWidth = 2;
        context.strokeRect(x + 7, y + 7, TILE - 14, TILE - 14);
        context.beginPath();
        context.moveTo(x + 9, y + 9);
        context.lineTo(x + TILE - 9, y + TILE - 9);
        context.moveTo(x + TILE - 9, y + 9);
        context.lineTo(x + 9, y + TILE - 9);
        context.stroke();
      }

      function drawBomb(bomb, time) {
        const center = centerOf(bomb.row, bomb.column);
        const pulse = 1 + Math.sin(time * 0.015 + bomb.timer * 9) * 0.08;
        context.fillStyle = bomb.timer < 0.65 ? "#ff5448" : "#19152c";
        context.strokeStyle = bomb.timer < 0.65 ? "#fff06a" : "#9b79ff";
        context.lineWidth = 3;
        context.beginPath();
        context.arc(center.x, center.y + 3, 14 * pulse, 0, TAU);
        context.fill();
        context.stroke();
        context.strokeStyle = "#ffb348";
        context.beginPath();
        context.moveTo(center.x + 7, center.y - 9);
        context.lineTo(center.x + 12, center.y - 17);
        context.lineTo(center.x + 17, center.y - 13);
        context.stroke();
        context.fillStyle = Math.floor(bomb.timer * 8) % 2 === 0 ? "#fff26c" : "#ff5c43";
        context.fillRect(center.x + 15, center.y - 16, 5, 5);
      }

      function drawExplosion(explosion) {
        const center = centerOf(explosion.row, explosion.column);
        const alpha = Math.min(1, explosion.life * 4);
        context.globalAlpha = alpha;
        context.fillStyle = "#ff5d2f";
        context.fillRect(center.x - 22, center.y - 8, 44, 16);
        context.fillRect(center.x - 8, center.y - 22, 16, 44);
        context.fillStyle = "#ffe86c";
        context.fillRect(center.x - 15, center.y - 4, 30, 8);
        context.fillRect(center.x - 4, center.y - 15, 8, 30);
        context.fillStyle = "#fffbd1";
        context.fillRect(center.x - 5, center.y - 5, 10, 10);
        context.globalAlpha = 1;
      }

      function drawExit(time) {
        if (!exitRevealed) {
          return;
        }
        const [row, column] = exitKey.split(":").map(Number);
        const center = centerOf(row, column);
        const inset = 9 + Math.sin(time * 0.006) * 2;
        context.fillStyle = "#10102c";
        context.fillRect(center.x - 18, center.y - 18, 36, 36);
        context.strokeStyle = enemies.length === 0 ? "#63faff" : "#8059aa";
        context.lineWidth = 3;
        context.strokeRect(center.x - inset, center.y - inset, inset * 2, inset * 2);
        context.fillStyle = enemies.length === 0 ? "#63faff" : "#8059aa";
        context.fillRect(center.x - 3, center.y - 3, 6, 6);
      }

      function drawPowerup(powerup, time) {
        const center = centerOf(powerup.row, powerup.column);
        const color = powerupColor(powerup.type);
        const label = powerup.type === "bomb" ? "B" : powerup.type === "range" ? "+" : powerup.type === "speed" ? ">" : "S";
        const pulse = 11 + Math.sin(time * 0.008 + powerup.phase) * 2;
        context.fillStyle = "rgba(4, 6, 17, .92)";
        context.strokeStyle = color;
        context.lineWidth = 2;
        context.beginPath();
        context.moveTo(center.x, center.y - pulse);
        context.lineTo(center.x + pulse, center.y);
        context.lineTo(center.x, center.y + pulse);
        context.lineTo(center.x - pulse, center.y);
        context.closePath();
        context.fill();
        context.stroke();
        context.fillStyle = color;
        context.font = "800 11px ui-monospace, monospace";
        context.textAlign = "center";
        context.textBaseline = "middle";
        context.fillText(label, center.x, center.y + 0.5);
      }

      function drawEnemy(enemy) {
        const bob = Math.sin(enemy.phase) * 2;
        context.fillStyle = enemy.color;
        context.beginPath();
        context.moveTo(enemy.x, enemy.y - 15 + bob);
        context.lineTo(enemy.x + 14, enemy.y - 4 + bob);
        context.lineTo(enemy.x + 10, enemy.y + 14 + bob);
        context.lineTo(enemy.x, enemy.y + 9 + bob);
        context.lineTo(enemy.x - 10, enemy.y + 14 + bob);
        context.lineTo(enemy.x - 14, enemy.y - 4 + bob);
        context.closePath();
        context.fill();
        context.fillStyle = "#08101c";
        context.fillRect(enemy.x - 8, enemy.y - 4 + bob, 5, 5);
        context.fillRect(enemy.x + 3, enemy.y - 4 + bob, 5, 5);
      }

      function drawPlayer() {
        if (player.invulnerable > 0 && Math.floor(player.invulnerable * 12) % 2 === 0) {
          return;
        }
        context.fillStyle = "#62faff";
        context.beginPath();
        context.arc(player.x, player.y - 3, 12, 0, TAU);
        context.fill();
        context.fillStyle = "#f3ffff";
        context.fillRect(player.x - 7, player.y - 13, 14, 5);
        context.fillStyle = "#3a52d6";
        context.fillRect(player.x - 12, player.y + 7, 9, 8);
        context.fillRect(player.x + 3, player.y + 7, 9, 8);
        context.fillStyle = "#07101b";
        context.fillRect(player.x - 7, player.y - 5, 4, 4);
        context.fillRect(player.x + 3, player.y - 5, 4, 4);
        if (shield > 0) {
          context.strokeStyle = "#a182ff";
          context.lineWidth = 2;
          context.beginPath();
          context.arc(player.x, player.y, 22, 0, TAU);
          context.stroke();
        }
      }

      function draw(time) {
        drawBackground(time);
        const shakeX = (Math.random() - 0.5) * shake;
        const shakeY = (Math.random() - 0.5) * shake;
        context.save();
        context.translate(shakeX, shakeY);
        drawFloor();

        for (let row = 0; row < ROWS; row += 1) {
          for (let column = 0; column < COLUMNS; column += 1) {
            if (isHardWall(row, column)) {
              drawHardWall(row, column);
            } else if (crates.has(keyFor(row, column))) {
              drawCrate(row, column);
            }
          }
        }
        drawExit(time);

        for (const powerup of powerups) {
          drawPowerup(powerup, time);
        }
        for (const bomb of bombs) {
          drawBomb(bomb, time);
        }
        for (const enemy of enemies) {
          drawEnemy(enemy);
        }
        drawPlayer();

        context.globalCompositeOperation = "lighter";
        for (const explosion of explosions) {
          drawExplosion(explosion);
        }
        for (const particle of particles) {
          const alpha = Math.max(0, particle.life / particle.maxLife);
          context.globalAlpha = alpha;
          context.fillStyle = particle.color;
          context.fillRect(particle.x, particle.y, particle.size, particle.size);
        }
        context.globalAlpha = 1;
        context.globalCompositeOperation = "source-over";
        context.restore();

        if (stageTimer > 0 && running) {
          context.fillStyle = "rgba(224, 253, 255, .84)";
          context.font = "800 13px ui-monospace, monospace";
          context.textAlign = "center";
          context.fillText(`STAGE ${String(stage + 1).padStart(2, "0")} INBOUND`, WORLD_WIDTH / 2, WORLD_HEIGHT / 2);
        }
        if (paused && running) {
          context.fillStyle = "rgba(2, 4, 12, .74)";
          context.fillRect(FIELD_X, FIELD_Y, COLUMNS * TILE, ROWS * TILE);
          context.fillStyle = "#e4feff";
          context.font = "800 22px ui-monospace, monospace";
          context.textAlign = "center";
          context.fillText("GRID PAUSED", WORLD_WIDTH / 2, WORLD_HEIGHT / 2);
        }
      }

      function frame(time) {
        const delta = Math.min((time - lastTime) / 1000, 0.04);
        lastTime = time;
        update(delta);
        draw(time);
        requestAnimationFrame(frame);
      }

      window.addEventListener("resize", resize);
      window.addEventListener("keydown", event => {
        if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(event.code)) {
          event.preventDefault();
        }
        if (!running && event.code === "Enter") {
          startGame();
          return;
        }
        if (event.code === "KeyP" && !event.repeat && running) {
          paused = !paused;
          keys.clear();
          showStatus(paused ? "Grid paused" : "Grid resumed", 1);
          return;
        }
        if (event.code === "Space" && !event.repeat) {
          placeBomb();
        }
        keys.add(event.code);
      });
      window.addEventListener("keyup", event => keys.delete(event.code));
      window.addEventListener("blur", () => {
        keys.clear();
        if (running) {
          paused = true;
        }
      });
      startButton.addEventListener("click", startGame);

      resize();
      createStage();
      running = false;
      updateHud();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
